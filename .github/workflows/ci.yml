name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  quality:
    name: "1 · Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend — ruff
        working-directory: backend
        run: |
          set -euo pipefail
          echo "::group::Install Python tooling"
          python -m pip install -q -r requirements-dev.txt
          echo "::endgroup::"

          echo "::notice title=Quality·backend::ruff check + format"
          python -m ruff check .
          python -m ruff format --check .
          echo "Backend lint OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — typecheck + eslint
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "::group::Install npm packages"
          npm ci --prefer-offline --no-audit --no-fund
          echo "::endgroup::"

          echo "::notice title=Quality·frontend::tsc --noEmit"
          npm run typecheck
          echo "::notice title=Quality·frontend::eslint"
          npm run lint
          {
            echo "### 1 · Quality"
            echo "- Backend ruff: pass"
            echo "- Frontend typecheck: pass"
            echo "- Frontend eslint: pass"
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: "2 · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend — pytest (offline)
        id: backend_unit
        working-directory: backend
        env:
          PUBG_API_KEY: test_api_key
        run: |
          set -euo pipefail
          echo "::group::Install Python tooling"
          python -m pip install -q -r requirements-dev.txt
          echo "::endgroup::"

          echo "::notice title=Unit·backend::pytest -m 'not integration'"
          set +e
          OUT="$(pytest -m "not integration" -q --tb=line 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          SUMMARY="$(echo "$OUT" | tail -n 1)"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Backend unit: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Backend unit failed::$SUMMARY"
            exit "$CODE"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — Jest
        id: frontend_unit
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "::group::Install npm packages"
          npm ci --prefer-offline --no-audit --no-fund
          echo "::endgroup::"

          echo "::notice title=Unit·frontend::npm run test:ci"
          set +e
          npm run test:ci > /tmp/frontend-unit.txt 2>&1
          CODE=$?
          set -e
          # Surface only PASS/FAIL suite lines + totals (CRA is otherwise very noisy)
          grep -E '^(PASS|FAIL) |Tests:|Test Suites:|● ' /tmp/frontend-unit.txt || true
          if [ "$CODE" -ne 0 ]; then
            echo "::group::Full Jest log"
            cat /tmp/frontend-unit.txt
            echo "::endgroup::"
          fi
          SUMMARY="$(grep -E 'Tests:|Test Suites:' /tmp/frontend-unit.txt | tr '\n' ' ' | sed 's/  */ /g')"
          echo "summary=${SUMMARY:-see log}" >> "$GITHUB_OUTPUT"
          echo "Frontend unit: ${SUMMARY:-see log}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Frontend unit failed::${SUMMARY:-see grouped Jest log}"
            exit "$CODE"
          fi

      - name: Unit summary
        if: always()
        run: |
          {
            echo "### 2 · Unit tests"
            echo "- Backend: ${{ steps.backend_unit.outputs.summary || 'failed before summary' }}"
            echo "- Frontend: ${{ steps.frontend_unit.outputs.summary || 'failed before summary' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  integrate:
    name: "3 · Stack + live API"
    runs-on: ubuntu-latest
    needs: [quality, unit]
    environment: pubg_api_key
    env:
      PUBG_API_KEY: ${{ secrets.API_KEY || vars.API_KEY }}
      PUBGOPS_BASE_URL: http://localhost:8000
      PUBGOPS_TEST_PLAYER: shroud
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare API key
        run: |
          set -euo pipefail
          # Trim CR/LF/spaces — trailing newlines break Authorization headers.
          PUBG_API_KEY="$(printf '%s' "$PUBG_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "PUBG_API_KEY=$PUBG_API_KEY" >> "$GITHUB_ENV"
          if [ -z "$PUBG_API_KEY" ]; then
            echo "::error title=Missing API key::Set API_KEY on the pubg_api_key environment (secret preferred)."
            exit 1
          fi
          printf 'PUBG_API_KEY=%s\n' "$PUBG_API_KEY" > backend/.env
          echo "::notice title=Integrate·key::API key loaded (${#PUBG_API_KEY} chars, trimmed)"
          echo "API key: ready (${#PUBG_API_KEY} chars)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and start Compose stack
        run: |
          set -euo pipefail
          echo "::notice title=Integrate·compose::Building images and starting services"
          echo "::group::docker compose up --build"
          docker compose up -d --build --quiet-pull
          echo "::endgroup::"
          echo "Compose: started" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for backend
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "::notice title=Integrate·health::Backend healthy (attempt $i)"
              echo "Backend health: OK (attempt $i)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Backend unhealthy::Did not respond on :8000 within ~2 minutes"
          echo "::group::backend logs"
          docker compose logs --no-color --tail=80 backend
          echo "::endgroup::"
          exit 1

      - name: Smoke checks
        run: |
          set -euo pipefail
          ROOT="$(curl -sf http://localhost:8000/)"
          echo "$ROOT" | grep -q 'PubgOps API is running'
          FE_CODE="$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/)"
          test "$FE_CODE" = "200"
          echo "::notice title=Integrate·smoke::GET / → OK · frontend → $FE_CODE"
          {
            echo "### Smoke"
            echo "- \`GET http://localhost:8000/\` → PubgOps API is running"
            echo "- \`GET http://localhost:3000/\` → $FE_CODE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Live PUBG API tests
        id: live
        working-directory: backend
        run: |
          set -euo pipefail
          echo "::group::Install Python tooling"
          python -m pip install -q -r requirements-dev.txt
          echo "::endgroup::"

          echo "::notice title=Integrate·live API::pytest -m integration (player=$PUBGOPS_TEST_PLAYER)"
          set +e
          OUT="$(pytest -m integration -q --tb=line 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          SUMMARY="$(echo "$OUT" | tail -n 1)"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Live API: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Live API failed::$SUMMARY"
            exit "$CODE"
          fi
          echo "::notice title=Integrate·live API::pass — $SUMMARY"

      - name: Backend logs on failure
        if: failure()
        run: |
          echo "::group::backend logs (tail 120)"
          docker compose logs --no-color --tail=120 backend || true
          echo "::endgroup::"

      - name: Tear down stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
          echo "Compose: torn down" >> "$GITHUB_STEP_SUMMARY"

  result:
    name: "CI result"
    runs-on: ubuntu-latest
    needs: [quality, unit, integrate]
    if: always()
    steps:
      - name: Pipeline status
        env:
          Q: ${{ needs.quality.result }}
          U: ${{ needs.unit.result }}
          I: ${{ needs.integrate.result }}
        run: |
          set -euo pipefail
          mark() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              skipped) echo "SKIP" ;;
              cancelled) echo "CANCEL" ;;
              *) echo "$1" ;;
            esac
          }

          {
            echo "## PubgOps CI"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| 1 · Quality | **$(mark "$Q")** (\`$Q\`) |"
            echo "| 2 · Unit tests | **$(mark "$U")** (\`$U\`) |"
            echo "| 3 · Stack + live API | **$(mark "$I")** (\`$I\`) |"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Scan the job list for **Annotations** (notice/error). Install and Docker build output is folded under groups."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=CI result::1 Quality=$Q · 2 Unit=$U · 3 Integrate=$I"

          if [ "$Q" != "success" ] || [ "$U" != "success" ] || [ "$I" != "success" ]; then
            echo "::error title=CI failed::1=$Q 2=$U 3=$I — open the FAIL job, then its Annotations"
            exit 1
          fi
          echo "::notice title=CI passed::All three stages green"
