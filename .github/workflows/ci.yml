name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend lint (ruff)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m ruff check .
          python -m ruff format --check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend unit tests
        working-directory: backend
        env:
          PUBG_API_KEY: test_api_key
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -m "not integration" -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run test:ci

  integrate:
    name: Compose smoke and live API
    runs-on: ubuntu-latest
    needs: [quality, unit]
    environment: pubg_api_key
    env:
      PUBG_API_KEY: ${{ secrets.API_KEY || vars.API_KEY }}
      PUBGOPS_BASE_URL: http://localhost:8000
      PUBGOPS_TEST_PLAYER: shroud
    steps:
      - uses: actions/checkout@v4

      - name: Require PUBG API key
        run: |
          if [ -z "$PUBG_API_KEY" ]; then
            echo "::error::PUBG_API_KEY is empty. Set API_KEY as a secret or variable on the pubg_api_key environment."
            exit 1
          fi

      - name: Write backend/.env for compose
        run: |
          printf 'PUBG_API_KEY=%s\n' "$PUBG_API_KEY" > backend/.env

      - name: Build and start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy in time"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Smoke checks
        run: |
          set -e
          ROOT="$(curl -sf http://localhost:8000/)"
          echo "$ROOT" | grep -q 'PubgOps API is running'
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q 200
          echo "Smoke checks passed"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Live PUBG API integration tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -m integration -q

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
