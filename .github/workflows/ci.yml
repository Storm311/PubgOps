name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  npm_config_fund: "false"
  npm_config_audit: "false"

jobs:
  quality:
    name: "1 · Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plan — what Quality checks
        run: |
          chmod +x .github/print-checklist.sh
          .github/print-checklist.sh "1 · Quality" "2 · Unit tests"
          echo "::notice title=1 · Quality plan::See job Summary for the full checklist (ruff, tsc, eslint)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend — ruff (lint + format)
        working-directory: backend
        run: |
          set -euo pipefail
          echo "::group::Install Python tooling"
          python -m pip install -q -r requirements-dev.txt
          echo "::endgroup::"

          echo "→ Looking for: no lint errors in backend/"
          python -m ruff check .
          echo "→ Looking for: formatting already matches ruff format"
          python -m ruff format --check .
          echo "::notice title=Quality·backend::ruff check + format — PASS"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — typecheck + eslint
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "::group::Install npm packages"
          npm ci --prefer-offline --no-audit --no-fund
          echo "::endgroup::"

          echo "→ Looking for: TypeScript compiles with no errors (tsc --noEmit)"
          npm run typecheck
          echo "::notice title=Quality·frontend::typecheck — PASS"

          echo "→ Looking for: eslint clean on frontend/src (0 warnings)"
          npm run lint
          echo "::notice title=Quality·frontend::eslint — PASS"

          {
            echo "### Quality result"
            echo "- ruff check/format: **PASS**"
            echo "- tsc --noEmit: **PASS**"
            echo "- eslint: **PASS**"
          } >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: "2 · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plan — what Unit tests cover
        run: |
          chmod +x .github/print-checklist.sh
          .github/print-checklist.sh "2 · Unit tests" "3 · Stack + live API"
          echo "::notice title=2 · Unit plan::6 backend + 2 frontend tests — see Summary for expectations"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend — pytest (offline)
        id: backend_unit
        working-directory: backend
        env:
          PUBG_API_KEY: test_api_key
        run: |
          set -euo pipefail
          echo "::group::Install Python tooling"
          python -m pip install -q -r requirements-dev.txt
          echo "::endgroup::"

          echo "Running offline API/telemetry tests (−v so each name appears):"
          echo "  • root health message"
          echo "  • telemetry invalid URL → 500"
          echo "  • telemetry missing body → 422"
          echo "  • telemetry sparse tracks from mocked gzip"
          echo "  • frame interpolation at t=15"
          echo "  • Sanhok map scale"
          set +e
          OUT="$(pytest -m "not integration" -v --tb=line 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          SUMMARY="$(echo "$OUT" | tail -n 1)"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          {
            echo "#### Backend unit result"
            echo '```'
            echo "$OUT" | grep -E 'PASSED|FAILED|ERROR|passed|failed' || echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Backend unit failed::$SUMMARY"
            exit "$CODE"
          fi
          echo "::notice title=Unit·backend::$SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — Jest
        id: frontend_unit
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "::group::Install npm packages"
          npm ci --prefer-offline --no-audit --no-fund
          echo "::endgroup::"

          echo "Running replayMath unit tests:"
          echo "  • formatDuration → 0:00 / 1:05 / 10:00"
          echo "  • lerp → 0, 100, 50, 12.5"
          set +e
          npm run test:ci > /tmp/frontend-unit.txt 2>&1
          CODE=$?
          set -e
          grep -E '^(PASS|FAIL) |✓ |✕ |Tests:|Test Suites:|● ' /tmp/frontend-unit.txt || true
          if [ "$CODE" -ne 0 ]; then
            echo "::group::Full Jest log"
            cat /tmp/frontend-unit.txt
            echo "::endgroup::"
          fi
          SUMMARY="$(grep -E 'Tests:|Test Suites:' /tmp/frontend-unit.txt | tr '\n' ' ' | sed 's/  */ /g')"
          echo "summary=${SUMMARY:-see log}" >> "$GITHUB_OUTPUT"
          {
            echo "#### Frontend unit result"
            echo "- ${SUMMARY:-see log}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Frontend unit failed::${SUMMARY:-see grouped Jest log}"
            exit "$CODE"
          fi
          echo "::notice title=Unit·frontend::${SUMMARY:-PASS}"

  integrate:
    name: "3 · Stack + live API"
    runs-on: ubuntu-latest
    needs: [quality, unit]
    environment: pubg_api_key
    env:
      PUBG_API_KEY: ${{ secrets.API_KEY || vars.API_KEY }}
      PUBGOPS_BASE_URL: http://localhost:8000
      PUBGOPS_TEST_PLAYER: shroud
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Plan — what Stack + live API covers
        run: |
          chmod +x .github/print-checklist.sh
          .github/print-checklist.sh "3 · Stack + live API"
          echo "::notice title=3 · Integrate plan::Compose smoke + live player stats/matches — see Summary"

      - name: Prepare API key
        run: |
          set -euo pipefail
          echo "→ Looking for: non-empty API_KEY (trim CR/LF — newlines break Authorization)"
          PUBG_API_KEY="$(printf '%s' "$PUBG_API_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "PUBG_API_KEY=$PUBG_API_KEY" >> "$GITHUB_ENV"
          if [ -z "$PUBG_API_KEY" ]; then
            echo "::error title=Missing API key::Set API_KEY on the pubg_api_key environment (secret preferred)."
            exit 1
          fi
          printf 'PUBG_API_KEY=%s\n' "$PUBG_API_KEY" > backend/.env
          echo "::notice title=Integrate·key::ready (${#PUBG_API_KEY} chars, trimmed)"

      - name: Build and start Compose stack
        run: |
          set -euo pipefail
          echo "→ Looking for: backend + frontend containers start from Dockerfiles"
          echo "::group::docker compose up --build"
          docker compose up -d --build --quiet-pull
          echo "::endgroup::"
          echo "::notice title=Integrate·compose::stack started"

      - name: Wait for backend
        run: |
          set -euo pipefail
          echo "→ Looking for: GET :8000/ succeeds (health)"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "::notice title=Integrate·health::backend OK (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Backend unhealthy::no response on :8000 within ~2 minutes"
          echo "::group::backend logs"
          docker compose logs --no-color --tail=80 backend
          echo "::endgroup::"
          exit 1

      - name: Smoke checks
        run: |
          set -euo pipefail
          echo "→ Looking for: API root message + frontend HTTP 200"
          ROOT="$(curl -sf http://localhost:8000/)"
          echo "$ROOT" | grep -q 'PubgOps API is running'
          FE_CODE="$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/)"
          test "$FE_CODE" = "200"
          echo "::notice title=Integrate·smoke::API root OK · frontend $FE_CODE"
          {
            echo "### Smoke result"
            echo "- API \`/\`: **PASS** (\`PubgOps API is running\`)"
            echo "- Frontend \`/\`: **PASS** ($FE_CODE)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Live PUBG API tests
        id: live
        working-directory: backend
        run: |
          set -euo pipefail
          echo "::group::Install Python tooling"
          python -m pip install -q -r requirements-dev.txt
          echo "::endgroup::"

          echo "Running live tests against $PUBGOPS_BASE_URL (player=$PUBGOPS_TEST_PLAYER):"
          echo "  • GET / — health JSON"
          echo "  • GET /player/$PUBGOPS_TEST_PLAYER — name, platform, stats.total_matches"
          echo "  • GET /player/$PUBGOPS_TEST_PLAYER/matches — list with match_id + Map/Kills"
          set +e
          OUT="$(pytest -m integration -v --tb=line 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          SUMMARY="$(echo "$OUT" | tail -n 1)"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          {
            echo "#### Live API result"
            echo '```'
            echo "$OUT" | grep -E 'PASSED|FAILED|ERROR|passed|failed' || echo "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=Live API failed::$SUMMARY"
            exit "$CODE"
          fi
          echo "::notice title=Integrate·live API::$SUMMARY"

      - name: Backend logs on failure
        if: failure()
        run: |
          echo "::group::backend logs (tail 120)"
          docker compose logs --no-color --tail=120 backend || true
          echo "::endgroup::"

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

  result:
    name: "CI result"
    runs-on: ubuntu-latest
    needs: [quality, unit, integrate]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Pipeline status
        env:
          Q: ${{ needs.quality.result }}
          U: ${{ needs.unit.result }}
          I: ${{ needs.integrate.result }}
        run: |
          set -euo pipefail
          mark() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              skipped) echo "SKIP" ;;
              cancelled) echo "CANCEL" ;;
              *) echo "$1" ;;
            esac
          }

          {
            echo "## PubgOps CI"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| 1 · Quality | **$(mark "$Q")** (\`$Q\`) |"
            echo "| 2 · Unit tests | **$(mark "$U")** (\`$U\`) |"
            echo "| 3 · Stack + live API | **$(mark "$I")** (\`$I\`) |"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Full expectations for every check: [\`.github/ci-checklist.md\`](.github/ci-checklist.md)"
            echo ""
            echo "Per-job **Summary** tabs list the plan + PASS/FAIL lines. **Annotations** highlight the short status."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=CI result::1 Quality=$Q · 2 Unit=$U · 3 Integrate=$I"

          if [ "$Q" != "success" ] || [ "$U" != "success" ] || [ "$I" != "success" ]; then
            echo "::error title=CI failed::1=$Q 2=$U 3=$I — open FAIL job Summary for which check/assertion broke"
            exit 1
          fi
          echo "::notice title=CI passed::All three stages green"
